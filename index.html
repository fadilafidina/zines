<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dila's collection of zines ₊˚⊹♡</title>
  <meta name="description" content="(˶ᵔ ᵕ ᵔ˶) a lil shelf of mini zines by fadila ♡ come flip through ✧˖°">
  <meta property="og:title" content="dila's collection of zines ₊˚⊹♡">
  <meta property="og:description" content="(˶ᵔ ᵕ ᵔ˶) a lil shelf of mini zines by fadila ♡ come flip through ✧˖°">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zines.pancakes.zip/">
  <meta property="og:image" content="https://zines.pancakes.zip/og-image.png?v=3">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="600">
  <meta name="twitter:card" content="summary">
  <link rel="preload" href="fonts/gaegu-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="zines.css">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="86065a2c-0d8e-40ca-a9c7-3370479c94a9" data-domains="zines.pancakes.zip"></script>
</head>
<body>

<!-- wobble filters that make every drawing look hand-inked -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="wob" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="3.4" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="wob2" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11"/>
    <feDisplacementMap in="SourceGraphic" scale="4" xChannelSelector="G" yChannelSelector="R"/>
  </filter>
  <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe38a" stop-opacity=".75"/>
    <stop offset="1" stop-color="#ffe38a" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="haloGrad">
    <stop offset="0" stop-color="#ffe9a3" stop-opacity=".8"/>
    <stop offset="1" stop-color="#ffe9a3" stop-opacity="0"/>
  </radialGradient>
</svg>

<header class="top">
  <a class="title" href="./">dila's zine shelf</a>
  <div class="mascot" id="mascot" aria-hidden="true"></div>
  <div class="top-right">
    <div class="clock" id="clock" aria-label="Sydney time"></div>
    <button class="sound" id="soundBtn" aria-pressed="true">sound on ♪</button>
  </div>
</header>

<main class="room" id="room">
  <p class="sub">₍ᐢ. .ᐢ₎ tiny zines folded from one sheet of paper ♡ pick one up!</p>
  <section class="shelves" id="shelves" aria-label="Shelf"></section>
  <footer class="foot"><span aria-hidden="true">(˶ᵔ ᵕ ᵔ˶)</span></footer>
</main>

<!-- zine viewer -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle" hidden>
  <p class="viewer-title"><span id="viewerTitle"></span> <span class="viewer-meta" id="viewerMeta"></span></p>
  <div class="stage" id="stage" tabindex="0" aria-label="Zine pages. Scroll or use the arrow keys to unfold.">
    <div class="strip" id="strip"></div>
  </div>
  <p class="viewer-hint" id="viewerHint">scroll to unfold ✧</p>
  <button class="back" id="viewerClose">back to shelf</button>
</div>

<script src="zines.js"></script>
</body>
</html>
